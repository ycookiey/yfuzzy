# タグ vX.Y.Z の push で npm に公開する（trusted publishing: OIDC で認証し、トークン・OTP を使わない）。
# npmjs.com のパッケージ設定で、この repository と workflow（publish.yml）を trusted publisher に登録しておく。
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm は package-lock.json を作った手元と同じ版にそろえる（版で peer 依存の扱いが違い、
      # 新しい npm では npm ci が lock 不一致で失敗しうる）。Node 24.11.0 同梱の npm 11.6.1 は
      # trusted publishing の要件（npm 11.5.1 以上）を満たす
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
      - run: npm -v
      - name: タグと package.json の版が一致するか
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
